<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrimba - Solo Project: Movie Watchlist</title>
    <link rel="stylesheet" href="./styles.css"/>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/b7b84cd73d.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="title-container">
                <h1 class="title">Find your film</h1>
                <button id="watchlist-btn" class="cta-btn">My Watchlist</button>
                <button id="search-for-movies-btn" class="cta-btn">Search for movies</button>
            </div>
            <div id="input-container" class="input-container">
                <label for="movie-input"><i class="fa-solid fa-magnifying-glass"></i></label>
                <input type="text" id="movie-input" name="movie-input" placeholder="Search for a movie"/>
                <button id="search-input">Search</button>
            </div>
        </header>
        <main id="main" class="main">
        </main>
    </div>
    <script src="index.js"></script>
</body>
</html>
